<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>HAXY</title>
        <style>
          html {
            --bg: rgba(0, 50, 70, 1.0);
            --fg: rgba(200, 200, 200, 1.0);
            /* the height of the font's box-drawing characters */
            --row: 19px;
            background-color: var(--bg);
            color: var(--fg);
          }

          /* no body margin because it could push content past the viewport and
             add a window scrollbar */
          body {
            margin: 0;
          }

          /* pages only download the full file if they need a character outside the core */
          @font-face {
            font-family: 'Haxy Mono';
            src: url('/HaxyMono-Core.woff2') format('woff2');
            unicode-range: U+0-FF, U+2010-202F, U+2190-2193, U+2260, U+2264-2265, U+2302, U+2500-259F, U+2610-2611, U+263C, U+2715, U+FFFD, U+1FB00-1FB3B;
          }

          @font-face {
            font-family: 'Haxy Mono';
            src: url('/HaxyMono-Full.woff2') format('woff2');
            unicode-range: U+100-200F, U+2030-218F, U+2194-225F, U+2261-2263, U+2266-2301, U+2303-24FF, U+25A0-260F, U+2612-263B, U+263D-2714, U+2716-FFFC, U+FFFE-1FAFF, U+1FB3C-10FFFF;
          }

          .page {
            font-family: 'Haxy Mono', monospace;
            /* 10px columns */
            font-size: 16.6667px;
            line-height: var(--row);
            /* keep -> and != as typed */
            font-variant-ligatures: none;
            position: relative;
          }

          #grid {
            white-space: pre;
            /* positioning context for the top-level .scroll divs */
            position: relative;
          }

          .ansi-art {
            position: absolute;
            top: 0;
            pointer-events: none;
          }

          .grid-content {
            position: relative;
          }

          /* js sizes the panes to the window; without it the page is as tall
             as its content and the browser scrolls it */
          html.js body:has(#grid .scroll:not([data-scroll-direction="horiz"])) {
            height: 100vh;
            overflow: hidden;
          }

          /* each web-native Scroll widget: a box positioned over its viewport
             (left/top/width/height and per-axis overflow come inline, the latter
             from the widget's scroll direction) */
          .scroll {
            position: absolute;
            /* scrollbars are hidden; panes scroll via wheel/trackpad and via
               scrollIntoView on keyboard focus, so a visible bar would only
               cover content. (Firefox / WebKit respectively.) */
            scrollbar-width: none;
          }
          .scroll::-webkit-scrollbar {
            display: none;
          }
          /* code blocks hide theirs too */
          .page textarea[readonly] {
            scrollbar-width: none;
          }
          .page textarea[readonly]::-webkit-scrollbar {
            display: none;
          }

          /* render each colored cell-run as an inline-block to prevent
             horizontal seams between rows of the block art. */
          #grid span,
          #grid a {
            display: inline-block;
            vertical-align: top;
          }

          /* a double-width rune pinned to its two grid cells so its advance
             width can't shift the rest of the row. */
          #grid .w2 {
            width: 2ch;
            overflow: hidden;
          }

          /* box-drawing runs, left out of a selection so copied text skips
             the borders around it */
          #grid .b {
            user-select: none;
            -webkit-user-select: none;
          }

          /* native controls are positioned over the matching TUI cells. */
          .page input,
          .page textarea,
          .page button {
            position: absolute;
            font: inherit;
            padding: 0;
            margin: 0;
            outline: none;
            box-sizing: border-box;
          }

          .page input,
          .page textarea {
            color: inherit;
            background: transparent;
            border: none;
          }

          /* the TUI border cells own the frame, so the textarea can't be
             drag-resized past them */
          .page textarea {
            resize: none;
            overflow-y: auto;
          }

          /* the TUI cells under the button render the border + label;
             the native button stays transparent so they show through
             and just owns the click + form-submit behavior. */
          .page button {
            background: transparent;
            color: transparent;
            border: none;
            cursor: pointer;
          }

          #grid a {
            color: inherit;
            text-decoration: none;
          }

          #grid .clickable {
            cursor: pointer;
          }

          #grid a.cell-link:hover {
            text-decoration: underline;
          }
        </style>
        <!-- tells the css that js runs -->
        <script>document.documentElement.classList.add("js");</script>
    </head>
    <body>
      <div class="page">
        <div id="grid">{{{ HAXY_HTML }}}</div>
      </div>
      <script id="page-data" type="application/json">{{{ HAXY_JSON }}}</script>
      <script src="/script.js"></script>
    </body>
</html>
