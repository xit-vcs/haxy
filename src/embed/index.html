<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{{{ HAXY_TITLE }}}</title>
        <style>
          /* ghostty's belafonte day */
          html {
            --bg: #d5ccba;
            --fg: #45373c;
            /* the font's box-drawing height */
            --row: 19px;
            background-color: var(--bg);
            color: var(--fg);
          }

          body {
            margin: 0;
          }

          /* the full file loads only for runes outside the core */
          @font-face {
            font-family: 'Haxy Mono';
            src: url('/HaxyMono-Core.woff2') format('woff2');
            unicode-range: U+0-FF, U+2010-202F, U+2190-2193, U+2260, U+2264-2265, U+2302, U+2500-259F, U+2610-2611, U+263C, U+2715, U+FFFD, U+1FB00-1FB3B;
          }

          @font-face {
            font-family: 'Haxy Mono';
            src: url('/HaxyMono-Full.woff2') format('woff2');
            unicode-range: U+100-6DE, U+6F0-70D, U+7F7, U+966-96F, U+9E6-9EF, U+B83, U+E3F, U+FCA-FD8, U+10A0-10FF, U+1400-16F8, U+18B0-18F5, U+1AB0-1AF0, U+1C80-1CBF, U+1D00-200F, U+2030-218B, U+2194-225F, U+2261-2263, U+2266-2301, U+2303-2429, U+2440-244A, U+2460-24FF, U+25A0-260F, U+2612-263B, U+263D-2714, U+2716-2BFF, U+2C60-2C7F, U+2CAF-2CB3, U+2CDF, U+2D00-2D7F, U+2DE0-2E63, U+3248-325F, U+32B1-32BF, U+3371-33DD, U+4DC0-4DFF, U+A5FF-A62B, U+A640-A69F, U+A708-A7FF, U+A95F, U+AA5C, U+AB30-AB6D, U+E0A0-E0BF, U+E23E, U+E256, U+E275, U+E606-E62C, U+E709-E712, U+E725-E73E, U+E769, U+E789-E78B, U+E7A8, U+E800-E865, U+EE00-EE0B, U+F009, U+F0C1, U+F0FD-F10C, U+F120, U+F179, U+F2DC, U+F302-F308, U+F35D, U+F418, U+F534, U+F6A4, U+F83D, U+F85A, U+F8D6, U+F8FF, U+FB01-FB4F, U+FBB2-FBBE, U+FD3E-FD3F, U+FDFD, U+FE20-FE2F, U+FE50-FE6B, U+FEFF, U+FFFC, U+10000, U+10143-1014D, U+10192, U+101F1-101F7, U+102FA, U+10780-107BF, U+10912, U+10B3A-10B3F, U+10C80-10CFF, U+115C9, U+1CC00-1CEFD, U+1D106-1D13E, U+1D15E-1D1AD, U+1D2C0-1D378, U+1D400-1D7FF, U+1DB00-1DB1C, U+1DF00-1DF2A, U+1DF95, U+1DFD0, U+1E05F, U+1F004, U+1F030-1F1AE, U+1F201-1F202, U+1F4AC, U+1F5AF-1F5B0, U+1F5E8-1F5EB, U+1F650-1F67F, U+1F6C7-1F6CA, U+1F6DC, U+1F700-1F7DB, U+1F7F0-1F8D8, U+1FA00-1FA57, U+1FA9D, U+1FB3C-1FBFA, U+F0000-F0125, U+F0632-F0636, U+F0AD1;
          }

          .page {
            font-family: 'Haxy Mono', monospace;
            /* 10px columns */
            font-size: 16.6667px;
            line-height: var(--row);
            font-variant-ligatures: none;
            position: relative;
          }

          #grid {
            white-space: pre;
            position: relative;
          }

          .ansi-art {
            position: absolute;
            top: 0;
            pointer-events: none;
          }

          .grid-content {
            position: relative;
          }

          /* js sizes the panes to the window, without it the page scrolls */
          html.js body:has(#grid .scroll:not([data-scroll-direction="horiz"])) {
            height: 100vh;
            overflow: hidden;
          }

          .scroll {
            position: absolute;
            scrollbar-width: none;
          }
          .scroll::-webkit-scrollbar {
            display: none;
          }
          .page textarea[readonly] {
            scrollbar-width: none;
          }
          .page textarea[readonly]::-webkit-scrollbar {
            display: none;
          }

          /* prevents seams between rows of block art */
          #grid span,
          #grid a {
            display: inline-block;
            vertical-align: top;
          }

          #grid .w2 {
            width: 2ch;
            overflow: hidden;
          }

          /* keeps borders out of copied text */
          #grid .b {
            user-select: none;
            -webkit-user-select: none;
          }

          .page input,
          .page textarea,
          .page button {
            position: absolute;
            font: inherit;
            padding: 0;
            margin: 0;
            outline: none;
            box-sizing: border-box;
          }

          .page input,
          .page textarea {
            color: inherit;
            background: transparent;
            border: none;
          }

          .page textarea {
            resize: none;
            overflow-y: auto;
          }

          /* the TUI cells under it draw the button */
          .page button {
            background: transparent;
            color: transparent;
            border: none;
            cursor: pointer;
          }

          #grid a {
            color: inherit;
            text-decoration: none;
          }

          #grid .clickable {
            cursor: pointer;
          }

          #grid a.cell-link:hover {
            text-decoration: underline;
          }
        </style>
        <script>document.documentElement.classList.add("js");</script>
    </head>
    <body>
      <div class="page">
        <div id="grid">{{{ HAXY_HTML }}}</div>
      </div>
      <script id="page-data" type="application/json">{{{ HAXY_JSON }}}</script>
      <script src="/script.js"></script>
    </body>
</html>
